name: Publish to PyPI

on:
  release:
    types: [published]       # publishing a GitHub release (tag v<version>) uploads that version to PyPI
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pillow

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "release tag ${GITHUB_REF_NAME} is not v$v (pyproject version)"; exit 1; }
          pre=$(python -c "from packaging.version import Version; print(str(Version('$v').is_prerelease).lower())")
          test "$pre" = "$PRERELEASE" || { echo "version $v has prerelease=$pre but the GitHub release says $PRERELEASE"; exit 1; }

      - name: Build
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          mkdir -p .tmp
          python scripts/packaging/build.py      # dexsuite wheel + sdist
          python -m twine check dist/*

      - name: Publish
        # PyPI Trusted Publishing (OIDC), no API token: the dexsuite project needs this repository and workflow
        # registered as its trusted publisher on pypi.org.
        uses: pypa/gh-action-pypi-publish@release/v1
