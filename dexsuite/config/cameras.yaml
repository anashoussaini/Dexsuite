dynamic:
  wrist_cam:
    fov: 60
    res: [224, 224]
    default:
      pos_offset: [0.0, 0.14, 0.0]
      quat_offset: [0.3466353, -0.938, 0.0, 0.0]
    overrides:
      robotiq:
        pos_offset: [0.0, 0.14, 0.0]
        quat_offset: [0.3466353, -0.938, 0.0, 0.0]
      # Sharpa: the D405 of the real rig (a camera plate on the back of the hand), its depth optical frame expressed
      # in right_hand_C_MC. Chain: plate at hand_to_cam_mount (0, 0, -0.066; rpy 0, -90 deg, 0 on the rig's
      # right_hand_base) -> mount_to_camera (0.01545, 0, -0.09403) -> D405 optical (0.01085, 0.009, 0.021;
      # rpy -90, 0, -90 deg), plus the 0.0295 m shift of this MJCF's root (flange included) vs the rig's root.
      # Renderer camera frame (-z forward, +y up): looks along hand +Z (fingers), up = -X (back of hand).
      # Alternatives: plate bolted directly on the Sharpa flange (yaw 0): pos_offset z 0.0173, same quat_offset;
      # hole-pattern 45-degree plate yaw: quat_offset [0.0, 0.9238795, -0.3826834, 0.0], pos_offset [0.0453, 0.0580, z].
      # D405 registered depth as recorded on the robot (1280x720, f 659.5 px): 16:9 at 224 rows, 57.3 deg vertical
      # Square central view: preserve vertical FOV and square pixels, render directly at 224 x 224.
      # Near 5 mm clears the housing front (~3.7 mm ahead of the optical origin).
      # This is a rendering clip plane, not a physical depth-sensor range model.
      sharpa:
        pos_offset: [0.073, 0.009, -0.0102]
        quat_offset: [0.0, 0.7071068, -0.7071068, 0.0]
        fov: 57.3
        res: [224, 224]
        near: 0.005
      sharpa_right:
        pos_offset: [0.073, 0.009, -0.0102]
        quat_offset: [0.0, 0.7071068, -0.7071068, 0.0]
        fov: 57.3
        res: [224, 224]
        near: 0.005
