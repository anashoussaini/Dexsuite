# Datasets train.py knows by name: python -m scripts.imitation_learning.robomimic.train --dataset <name> ...
# Every dexsuite set on huggingface.co/dexsuite. Any other Hugging Face repo id or local LeRobot folder also works
# as --dataset (its task is read from the dataset; pass --task to override).

# Track 1, human teleoperation (50 demonstrations per pair; reach_franka_robotiq has 51)
reach_franka_robotiq:
  repo_id: dexsuite/reach_franka_robotiq
  task: reach
  default_sensors: state
  h5_basename: reach_franka_robotiq
  action_normalization: dataset
  no_images: true

