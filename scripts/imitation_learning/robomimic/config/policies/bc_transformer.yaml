description: BC-Transformer recipe (AdamW, cosine LR, weight decay, gradient clipping, GMM head with min_std floor) with sensors selected by train.py.
algo_name: bc
no_images: true
config:
  experiment:
    rollout:
      enabled: true
      n: 50
      horizon: 400
      rate: 50
      warmstart: 0
      terminate_on_success: true
  train:
    num_data_workers: 0
    hdf5_cache_mode: low_dim
    seq_length: 16
    frame_stack: 2
    pad_seq_length: true
    pad_frame_stack: true
    dataset_keys:
      - actions
    batch_size: 100
    num_epochs: 500
    max_grad_norm: 1.0
  algo:
    optim_params:
      policy:
        optimizer_type: adamw
        learning_rate:
          initial: 0.0001
          step_every_batch: true
          scheduler_type: cosine
          num_cycles: 0.5
          warmup_steps: 500
        regularization:
          L2: 0.01
    actor_layer_dims: []
    gaussian:
      enabled: false
    gmm:
      enabled: true
      num_modes: 5
      min_std: 0.02
      std_activation: softplus
      low_noise_eval: true
    vae:
      enabled: false
    rnn:
      enabled: false
    transformer:
      enabled: true
      supervise_all_steps: false
      num_layers: 6
      embed_dim: 512
      num_heads: 8
