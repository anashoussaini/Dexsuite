description: Diffusion policy recipe with sensors selected by train.py.
algo_name: diffusion_policy
no_images: true
config:
  experiment:
    rollout:
      enabled: true
      n: 5
      horizon: 400
      rate: 25
      warmstart: 0
      terminate_on_success: true
  train:
    num_data_workers: 0
    hdf5_cache_mode: low_dim
    seq_length: 16
    frame_stack: 2
    batch_size: 100
    num_epochs: 500
  algo:
    optim_params:
      policy:
        optimizer_type: adamw
        learning_rate:
          initial: 0.0001
          step_every_batch: true
          scheduler_type: cosine
          num_cycles: 0.5
          warmup_steps: 500
        regularization:
          L2: 0.000001
    horizon:
      observation_horizon: 2
      action_horizon: 8
      prediction_horizon: 16
    unet:
      enabled: true
      diffusion_step_embed_dim: 256
      down_dims: [256, 512, 1024]
      kernel_size: 5
      n_groups: 8
    ema:
      enabled: true
      power: 0.75
    ddpm:
      enabled: true
      num_train_timesteps: 100
      num_inference_timesteps: 100
      beta_schedule: squaredcos_cap_v2
      clip_sample: true
      prediction_type: epsilon
