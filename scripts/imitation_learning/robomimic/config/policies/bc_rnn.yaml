description: BC-RNN (LSTM) for sequential tasks.
algo_name: bc
no_images: true
config:
  train:
    num_data_workers: 0
    hdf5_cache_mode: low_dim
    seq_length: 10
    frame_stack: 1
    dataset_keys:
      - actions
    batch_size: 100
  algo:
    actor_layer_dims:
      - 1024
      - 1024
    gaussian:
      enabled: false
    gmm:
      enabled: true
      num_modes: 5
      min_std: 0.0001
      std_activation: softplus
      low_noise_eval: true
    vae:
      enabled: false
    rnn:
      enabled: true
      horizon: 10
      hidden_dim: 1000
      rnn_type: LSTM
      num_layers: 2
    transformer:
      enabled: false
